name: Apply related-guides cross-links (one-off)
on:
  push:
    branches: [main]
    paths: ['tools/cross_links.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply, remove tooling, commit
        run: |
          python3 tools/cross_links.py
          git rm -q -r tools .github/workflows/apply-cross-links.yml
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          git commit -m "Internal linking: related-guides block on every guide and channel page (cluster audit fix)"
          git push
