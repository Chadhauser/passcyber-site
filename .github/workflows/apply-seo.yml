name: Apply SEO head tags (one-off)
on:
  push:
    branches: [main]
    paths: ['tools/seo_fix.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fixer, remove tooling, commit
        run: |
          python3 tools/seo_fix.py . https://passcyber.co.uk
          git rm -q -r tools .github/workflows/apply-seo.yml
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add -A
          git commit -m "SEO: Open Graph and JSON-LD head tags on service pages"
          git push
